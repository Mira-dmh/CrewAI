        "jobs_with_location": "percentage",
        "average_data_quality": "percentage of fields populated"
      }
    }

linkedin_verification_task:
  description: >
    **ROLE**: As the Verification Specialist, you are the final filter ensuring that all information, 
    data, and claims produced by other agents meet the highest standard of factual integrity before 
    being presented to the user.
    
    **MISSION**: Validate and confirm the accuracy of LinkedIn job posting data, market trends analysis, 
    and all claims made by previous agents. Cross-examine facts, validate sources, and flag any 
    questionable information through meticulous, skeptical analysis.
    
    **TRUSTED GROUND TRUTH SOURCES** (Always reference these):
    1. **U.S. Bureau of Labor Statistics (BLS)** - Official median wages and employment data
    2. **Glassdoor** - Salary ranges, company reviews, and market benchmarks
    3. **Indeed** - Job market trends and salary statistics
    4. **PayScale** - Compensation benchmarks by title and location
    5. **LinkedIn Salary Insights** - Platform's own verified salary data
    6. **Levels.fyi** - Tech industry compensation data (for technical roles)
    
    **DISCIPLINED VERIFICATION PROCESS**:
    For EACH job posting and EACH claim in the market trends analysis:
    
    STEP 1: Cross-Examine Job Posting Data
    - Use the "LinkedIn Job Data Verifier" tool to validate each posting
    - Apply logical reasoning to identify inconsistencies
    - **CRITICAL: LOCATION MATCHING** - Compare actual job location with user's search location:
      * If user searched for "CA" (California), job must be in California, NOT Canada
      * If location doesn't match (e.g., Toronto when searching CA), REJECT the job immediately
      * Use geographic validation: CA = California (US state), not Canada provinces like Ontario/Alberta
      * Match city names: "San Francisco, CA" matches "CA", "Toronto, Ontario" does NOT match "CA"
    - Verify against 7 critical dimensions (weighted by importance):
      * Location Matching (35% weight) - MUST match user search location; automatic rejection if mismatch
      * Salary Verification (25% weight) - Cross-reference BLS/Glassdoor/PayScale; flag outliers
      * Company Verification (15% weight) - Validate existence via LinkedIn/Glassdoor/Fortune lists
      * Job Title Normalization (10% weight) - Match against O*NET occupation taxonomy
      * Location Market Data (5% weight) - Verify cost-of-living adjustments via BLS regional data
      * Temporal Consistency (5% weight) - Flag stale postings (>90 days = potentially filled)
      * Link Validity (5% weight) - Verify LinkedIn URL structure and accessibility
    
    STEP 2: Skeptical Review of Market Trends
    - Question every statistical claim from the market trends analyst
    - Verify that skill frequencies match actual job description content
    - Confirm salary averages are mathematically correct from source data
    - Check that geographic distributions align with known market realities
    - Flag any claims that seem implausible or lack supporting evidence
    
    STEP 3: Generate Confidence Scores
    - Calculate overall_confidence_score (0-1 scale) for each verified job
    - Assign confidence_level: HIGH (≥0.85), MEDIUM (0.70-0.84), LOW (<0.70)
    - Document component_scores showing breakdown by verification dimension
    - List flagged_issues with severity levels: critical/high/medium/low
    - Provide actionable recommendations for addressing identified issues
    
    STEP 4: Aggregate Quality Assessment
    - Calculate average confidence score across the entire dataset
    - Count jobs by confidence level to assess overall data quality
    - Identify patterns in flagged issues (common problems across multiple jobs)
    - Flag critical issues requiring immediate user attention
    
    **DATE VALIDATION** (Critical for Integrity):
    - Distinguish "Reposted X ago" (re-advertisement) from "Posted X ago" (original date)
    - Flag jobs posted >3 months ago as "potentially_filled" (high risk)
    - Flag jobs posted >1 year ago as "invalid" (almost certainly filled or fake)
    - Track posting freshness to help users prioritize recent opportunities
    
    **QUALITY STANDARDS**:
    - Prioritize clarity, truth, and completeness in all verification outputs
    - Never approve questionable data without flagging concerns
    - Maintain skepticism: if something seems wrong, investigate thoroughly
    - Be the respected "final filter" - what you approve must be trustworthy
    
    **OUTPUT REQUIREMENTS**:
    Return a comprehensive verification report that validates every claim and provides 
    quantitative confidence metrics for all jobs. Flag ALL inconsistencies, no matter how minor.
  expected_output: >
    A comprehensive JSON verification report demonstrating meticulous fact-checking and skeptical analysis:
    {
      "verification_summary": {
        "total_jobs_verified": "exact count of jobs processed through verification",
        "average_confidence_score": "mean confidence score (0.00-1.00 scale)",
        "high_confidence_jobs": "count with score ≥ 0.85 (approved for user presentation)",
        "medium_confidence_jobs": "count with score 0.70-0.84 (acceptable with caveats)",
        "low_confidence_jobs": "count with score < 0.70 (flagged for review or rejection)",
        "flagged_for_review": "count requiring immediate manual review before user display",
        "verification_status": "PASSED/FAILED - overall assessment of data quality"
      },
      "ground_truth_sources_used": [
        "U.S. Bureau of Labor Statistics (BLS) - Official employment and wage data",
        "Glassdoor - Salary benchmarks and company verification",
        "Indeed - Market trends and job posting validation",
        "PayScale - Compensation benchmarks by role and location",
        "LinkedIn Salary Insights - Platform-native salary verification",
        "O*NET Occupation Taxonomy - Job title standardization",
        "Levels.fyi - Tech industry compensation data (when applicable)"
      ],
      "verified_jobs": [
        {
          "job_id": "LinkedIn job ID from posting",
          "job_title": "exact job title as posted",
          "company_name": "company name from posting",
          "verification_status": "VERIFIED/FLAGGED/REJECTED",
          "overall_confidence_score": "0.xxx (weighted composite of all dimension scores)",
          "confidence_level": "HIGH/MEDIUM/LOW (based on score thresholds)",
          "component_scores": {
            "location_matching": "0.xxx or 1.0 (35% weight) - CRITICAL: 1.0 if matches search location, 0.0 if mismatch",
            "salary_verification": "0.xxx (25% weight) - BLS/Glassdoor/PayScale cross-reference",
            "company_verification": "0.xxx (15% weight) - LinkedIn/Glassdoor/Fortune validation",
            "title_normalization": "0.xxx (10% weight) - O*NET taxonomy match",
            "location_market": "0.xxx (5% weight) - BLS regional data alignment",
            "temporal_consistency": "0.xxx (5% weight) - posting date freshness assessment",
            "link_validity": "0.xxx (5% weight) - URL structure and accessibility check"
          },
          "location_verification": {
            "search_location": "user's original search input (e.g., 'CA' for California)",
            "actual_location": "real location from LinkedIn posting (e.g., 'Toronto, Ontario')",
            "match_status": "MATCH/MISMATCH/UNCERTAIN",
            "match_confidence": "0.xxx - how confident we are in the location match",
            "rejection_reason": "if MISMATCH: explain why (e.g., 'Toronto is in Canada, not California')"
          },
          "flagged_issues": [
            {
              "type": "salary_anomaly/missing_company/outdated_posting/invalid_link/title_mismatch/location_inconsistency",
              "field": "specific field with the issue (e.g., salary_range, company_name)",
              "severity": "CRITICAL/HIGH/MEDIUM/LOW",
              "message": "detailed explanation of what's wrong and why it's concerning",
              "expected_value": "what the value should be based on ground truth sources",
              "actual_value": "what was found in the posting data",
              "recommendation": "specific action to address this issue"
            }
          ],
          "verification_notes": "additional context from skeptical analysis and logical reasoning",
          "user_action_required": "yes/no - whether user should take action before applying"
        }
      ],
      "critical_issues": [
        {
          "job_id": "job ID with critical issue requiring immediate attention",
          "issue_type": "FAKE_POSTING/EXPIRED_JOB/SALARY_SCAM/COMPANY_NOT_FOUND/BROKEN_LINK",
          "severity": "CRITICAL",
          "description": "detailed explanation of the critical issue",
          "recommendation": "DO_NOT_APPLY/VERIFY_EXTERNALLY/CONTACT_COMPANY_DIRECTLY",
          "impact": "why this issue matters for the user's job search"
        }
      ],
      "market_trends_validation": {
        "salary_averages_verified": "yes/no - whether calculated averages match source data",
        "skill_frequencies_verified": "yes/no - whether claimed frequencies match job descriptions",
        "geographic_distribution_verified": "yes/no - whether location data aligns with market reality",
        "flagged_statistical_claims": [
          {
            "claim": "specific claim from market trends analyst",
            "issue": "why this claim is questionable",
            "evidence": "what the ground truth sources actually show"
          }
        ]
      },
      "date_validation_report": {
        "recent_postings": "count posted within 7 days (highest priority for users)",
        "moderately_recent": "count posted 8-30 days ago (good candidates)",
        "older_postings": "count posted 1-3 months ago (potentially filled)",
        "outdated_postings": "count posted >3 months ago (FLAGGED - high risk)",
        "invalid_postings": "count posted >1 year ago (FLAGGED - almost certainly invalid)",
        "reposted_jobs": "count with 'Reposted' designation (re-advertisements)",
        "freshness_score": "0.00-1.00 - overall posting freshness metric"
      },
      "overall_data_quality": "HIGH/MEDIUM/LOW - final assessment based on average confidence score",
      "quality_assessment_rationale": "explanation of why this quality level was assigned",
      "user_recommendations": [
        "Prioritize jobs with HIGH confidence scores and recent posting dates",
        "Exercise caution with jobs flagged for specific issues (details in flagged_issues)",
        "Verify critical information independently before applying to MEDIUM/LOW confidence jobs",
        "Additional specific recommendations based on identified patterns and issues"
      ],
      "verification_specialist_notes": "final comments from the skeptical analysis, including any concerns about data reliability, patterns observed across the dataset, and overall assessment of information trustworthiness"
    }
    
    CRITICAL REQUIREMENT: Return ONLY the JSON verification report. No additional text, explanations, 
    or commentary outside the JSON structure. The report itself documents all findings and reasoning.
